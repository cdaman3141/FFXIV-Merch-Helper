<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lamia Materia Price Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0e27;
            color: #e0e0e0;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            margin-bottom: 30px;
            border-bottom: 2px solid #2a9d8f;
            padding-bottom: 15px;
        }
        
        h1 {
            color: #2a9d8f;
            margin-bottom: 10px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 10px 20px;
            background: #2a9d8f;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #1f7f70;
        }
        
        button.secondary {
            background: #555;
        }
        
        button.secondary:hover {
            background: #666;
        }
        
        .status {
            padding: 10px;
            background: #1a2332;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .status.loading {
            color: #2a9d8f;
        }
        
        .status.error {
            color: #e74c3c;
        }
        
        .status.success {
            color: #27ae60;
        }
        
        .items-container {
            display: grid;
            gap: 20px;
        }
        
        .item {
            background: #1a2332;
            border: 1px solid #2a3f52;
            border-radius: 8px;
            padding: 15px;
            transition: border-color 0.2s;
        }
        
        .item.selected {
            border-color: #2a9d8f;
        }
        
        .item-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .item-name {
            font-weight: 600;
            font-size: 16px;
            color: #2a9d8f;
            flex: 1;
        }
        
        .item-checkbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .lamia-prices {
            background: #0f1823;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 13px;
            border-left: 3px solid #e74c3c;
        }
        
        .price-row {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }
        
        .price-row:last-child {
            margin-bottom: 0;
        }
        
        .price-label {
            color: #999;
            min-width: 80px;
        }
        
        .listings-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        .listings-table thead {
            background: #0f1823;
        }
        
        .listings-table th,
        .listings-table td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #2a3f52;
        }
        
        .listings-table th {
            color: #2a9d8f;
            font-weight: 600;
        }
        
        .listings-table tr:hover {
            background: #0f1823;
        }
        
        .listing-checkbox {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        
        .world-name {
            color: #2a9d8f;
        }
        
        .price {
            color: #f39c12;
            font-weight: 500;
        }
        
        .no-data {
            color: #999;
            padding: 10px;
            font-style: italic;
        }
        
        .output-section {
            margin-top: 30px;
            border-top: 2px solid #2a3f52;
            padding-top: 20px;
        }
        
        .output-box {
            background: #0f1823;
            border: 1px solid #2a3f52;
            border-radius: 4px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .output-box.route {
            color: #2a9d8f;
        }
        
        .output-box.summary {
            color: #f39c12;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Lamia Materia Price Checker</h1>
            <p>Select items and worlds to build your buying route</p>
        </header>
        
        <div class="status" id="status">Click "Load Data" to start</div>
        
        <div class="controls">
            <button onclick="loadData()">Load Data</button>
            <button class="secondary" onclick="selectAll()">Select All Items</button>
            <button class="secondary" onclick="deselectAll()">Deselect All</button>
            <button onclick="generateRoute()">Generate Route</button>
            <button class="secondary" onclick="clearRoute()">Clear Output</button>
        </div>
        
        <div class="items-container" id="itemsContainer">
            <div class="no-data">No data loaded. Click "Load Data" to begin.</div>
        </div>
        
        <div class="output-section" id="outputSection" style="display: none;">
            <h2 style="color: #2a9d8f; margin-bottom: 15px;">Your Buying Route</h2>
            <div class="output-box route" id="routeOutput"></div>
            <div style="margin-top: 15px;">
                <h3 style="color: #2a9d8f; margin-bottom: 10px;">Summary</h3>
                <div class="output-box summary" id="summaryOutput"></div>
            </div>
            <button onclick="copyToClipboard()">Copy Route to Clipboard</button>
        </div>
    </div>
    
    <script>
        let data = [];
        let selections = {}; // { itemName: { world: selected, ... }, ... }
        
        async function loadData() {
            const status = document.getElementById('status');
            status.className = 'status loading';
            status.textContent = 'Fetching prices from Universalis API...';
            
            try {
                const response = await fetch('/api/fetch-prices');
                const result = await response.json();
                
                if (!response.ok) {
                    throw new Error(result.error || 'Unknown error');
                }
                
                data = result.data;
                renderItems();
                status.className = 'status success';
                status.textContent = `Loaded ${data.length} items. Select items and worlds below.`;
            } catch (error) {
                status.className = 'status error';
                status.textContent = `Error loading data: ${error.message}`;
            }
        }
        
        function renderItems() {
            const container = document.getElementById('itemsContainer');
            container.innerHTML = '';
            
            data.forEach((item, idx) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item';
                itemDiv.id = `item-${idx}`;
                
                // Item name with checkbox
                const header = document.createElement('div');
                header.className = 'item-header';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'item-checkbox';
                checkbox.onchange = (e) => toggleItem(idx, e.target.checked);
                
                const name = document.createElement('div');
                name.className = 'item-name';
                name.textContent = item.name;
                
                header.appendChild(checkbox);
                header.appendChild(name);
                itemDiv.appendChild(header);
                
                // Lamia prices
                const lamia = document.createElement('div');
                lamia.className = 'lamia-prices';
                lamia.innerHTML = `
                    <div class="price-row">
                        <span class="price-label">Lamia Lowest:</span>
                        <span>${item.lamia.lowest || 'n/a'}</span>
                    </div>
                    <div class="price-row">
                        <span class="price-label">Median:</span>
                        <span>${item.lamia.median || 'n/a'}</span>
                    </div>
                    <div class="price-row">
                        <span class="price-label">Sell Price:</span>
                        <span>${item.lamia.reasonable_sell || 'n/a'}</span>
                    </div>
                `;
                itemDiv.appendChild(lamia);
                
                // Listings table
                if (item.listings.length === 0) {
                    const noData = document.createElement('div');
                    noData.className = 'no-data';
                    noData.textContent = 'No listings available';
                    itemDiv.appendChild(noData);
                } else {
                    const table = document.createElement('table');
                    table.className = 'listings-table';
                    
                    const thead = document.createElement('thead');
                    thead.innerHTML = `
                        <tr>
                            <th style="width: 20px;"></th>
                            <th>World</th>
                            <th>Price</th>
                            <th>Qty</th>
                        </tr>
                    `;
                    table.appendChild(thead);
                    
                    const tbody = document.createElement('tbody');
                    item.listings.forEach((listing, lidx) => {
                        const tr = document.createElement('tr');
                        
                        const checkCell = document.createElement('td');
                        const listingCheckbox = document.createElement('input');
                        listingCheckbox.type = 'checkbox';
                        listingCheckbox.className = 'listing-checkbox';
                        listingCheckbox.onchange = (e) => toggleListing(idx, listing.world, e.target.checked);
                        checkCell.appendChild(listingCheckbox);
                        tr.appendChild(checkCell);
                        
                        const worldCell = document.createElement('td');
                        worldCell.className = 'world-name';
                        worldCell.textContent = listing.world;
                        tr.appendChild(worldCell);
                        
                        const priceCell = document.createElement('td');
                        priceCell.className = 'price';
                        priceCell.textContent = listing.price.toLocaleString();
                        tr.appendChild(priceCell);
                        
                        const qtyCell = document.createElement('td');
                        qtyCell.textContent = listing.quantity;
                        tr.appendChild(qtyCell);
                        
                        tbody.appendChild(tr);
                    });
                    table.appendChild(tbody);
                    itemDiv.appendChild(table);
                }
                
                container.appendChild(itemDiv);
                
                // Initialize selections
                if (!selections[item.name]) {
                    selections[item.name] = {};
                }
            });
        }
        
        function toggleItem(idx, checked) {
            const item = data[idx];
            const itemDiv = document.getElementById(`item-${idx}`);
            if (checked) {
                itemDiv.classList.add('selected');
                item.listings.forEach(l => {
                    selections[item.name][l.world] = true;
                });
            } else {
                itemDiv.classList.remove('selected');
                selections[item.name] = {};
            }
            updateCheckboxes(idx, checked);
        }
        
        function toggleListing(idx, world, checked) {
            const item = data[idx];
            selections[item.name][world] = checked;
        }
        
        function updateCheckboxes(idx, checked) {
            const itemDiv = document.getElementById(`item-${idx}`);
            const checkboxes = itemDiv.querySelectorAll('.listing-checkbox');
            checkboxes.forEach(cb => cb.checked = checked);
        }
        
        function selectAll() {
            document.querySelectorAll('.item-checkbox').forEach((cb, idx) => {
                cb.checked = true;
                toggleItem(idx, true);
            });
        }
        
        function deselectAll() {
            document.querySelectorAll('.item-checkbox').forEach((cb, idx) => {
                cb.checked = false;
                toggleItem(idx, false);
            });
        }
        
        function generateRoute() {
            // Collect selected worlds and items
            const route = {};
            const itemsSelected = {};
            
            Object.entries(selections).forEach(([itemName, worlds]) => {
                Object.entries(worlds).forEach(([world, selected]) => {
                    if (!selected) return;
                    
                    if (!route[world]) route[world] = [];
                    route[world].push(itemName);
                    
                    if (!itemsSelected[itemName]) itemsSelected[itemName] = [];
                    if (!itemsSelected[itemName].includes(world)) {
                        itemsSelected[itemName].push(world);
                    }
                });
            });
            
            // Generate route output
            let routeText = '';
            const sortedWorlds = Object.keys(route).sort();
            routeText += `BUYING ROUTE (${sortedWorlds.length} worlds)\n`;
            routeText += '='.repeat(50) + '\n\n';
            
            sortedWorlds.forEach(world => {
                routeText += `${world}:\n`;
                route[world].forEach(item => {
                    const itemData = data.find(d => d.name === item);
                    const listing = itemData.listings.find(l => l.world === world);
                    if (listing) {
                        routeText += `  - ${item} @ ${listing.price.toLocaleString()} gil (qty: ${listing.quantity})\n`;
                    }
                });
                routeText += '\n';
            });
            
            // Summary
            let summaryText = '';
            summaryText += `Total worlds to visit: ${sortedWorlds.length}\n`;
            summaryText += `Worlds: ${sortedWorlds.join(', ')}\n\n`;
            summaryText += `Items selected:\n`;
            Object.entries(itemsSelected).sort().forEach(([item, worlds]) => {
                summaryText += `  ${item}: ${worlds.join(', ')}\n`;
            });
            
            document.getElementById('routeOutput').textContent = routeText;
            document.getElementById('summaryOutput').textContent = summaryText;
            document.getElementById('outputSection').style.display = 'block';
        }
        
        function clearRoute() {
            document.getElementById('outputSection').style.display = 'none';
            document.getElementById('routeOutput').textContent = '';
            document.getElementById('summaryOutput').textContent = '';
        }
        
        function copyToClipboard() {
            const route = document.getElementById('routeOutput').textContent;
            navigator.clipboard.writeText(route).then(() => {
                alert('Route copied to clipboard!');
            });
        }
    </script>
</body>
</html>
